version: '3.8'
services:
  api:
    build: ./backend
    ports:
      - "3001:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend:/app
      - uploads:/app/uploads
    environment:
      - PORT=3001
      - SANDBOX_IMAGE=jaka-lms-worker
      - WORKERS=3
    depends_on:
      - worker-image

  worker-image:
    image: jaka-lms-worker
    build:
      context: ./backend/sandbox
    # dummy to ensure image built

volumes:
  uploads:
